name: Verify the signed frontier

# On every change to the signed frontier, vela-science/vela re-derives it
# from a clean checkout and proves the working tree IS the signed state (replay +
# signatures + hash parity). A witness-bearing frontier also re-runs every frozen
# verifier on every stored witness. It NEVER signs and NEVER merges.
on:
  push:
    branches: [main]
    paths: [".vela/**", "frontier.json", "frontier.yaml", "vela.lock", "proof/**", "witnesses/**", ".github/workflows/vela-frontier.yml"]
  pull_request:
    paths: [".vela/**", "frontier.json", "frontier.yaml", "vela.lock", "proof/**", "witnesses/**"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  VELA_VERSION: v0.914.2
  VELA_LINUX_ARCHIVE_SHA256: 3224c4b421ee94d2b28f957972d57a538a51b6eee9534ada59ea7ef3758da957
  VELA_LINUX_SHA256: 36a4f1ac0c29ee0cf7f7d8d87a2468d787135d7212e38fd0da878d1765f012bf
  VELA_TRUST_ANCHOR_SHA256: d2fb4f0783f666dde7bbbc864993e785a45718d09d11d5c362461c8a3d44c2f6

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install the lock-matching Vela release
        shell: bash
        run: |
          set -euo pipefail
          lock_version="$(awk '/^vela_version:/{print $2}' vela.lock)"
          requested="${VELA_VERSION#v}"
          test -n "$lock_version"
          test "$lock_version" = "$requested"
          archive="$(mktemp)"
          extracted="$(mktemp -d)"
          trap 'rm -f "$archive"; rm -rf "$extracted"' EXIT
          curl -fsSL \
            "https://github.com/vela-science/vela/releases/download/${VELA_VERSION}/vela-linux-x86_64.tar.gz" \
            -o "$archive"
          echo "${VELA_LINUX_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$extracted"
          echo "${VELA_LINUX_SHA256}  $extracted/vela" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install "$extracted/vela" "$HOME/.local/bin/vela"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vela" --version
      - name: Install the independently provisioned repository trust anchor
        env:
          VELA_REPOSITORY_TRUST_ANCHOR_B64: ${{ vars.VELA_REPOSITORY_TRUST_ANCHOR_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VELA_REPOSITORY_TRUST_ANCHOR_B64:-}"
          trust_dir="$HOME/.vela/trust/frontiers"
          trust_file="$trust_dir/vfr_97d7d25957384f80.json"
          install -d -m 700 "$HOME/.vela" "$HOME/.vela/trust" "$trust_dir"
          printf '%s' "$VELA_REPOSITORY_TRUST_ANCHOR_B64" | base64 --decode > "$trust_file"
          chmod 600 "$trust_file"
          echo "${VELA_TRUST_ANCHOR_SHA256}  $trust_file" | sha256sum -c -
      - name: Re-derive and prove the working tree is the signed state
        run: vela check . --strict
      - name: Reproduce every stored witness from scratch
        run: |
          if ls witnesses/*.witness.json >/dev/null 2>&1; then
            vela reproduce .
          else
            echo "no witnesses — this frontier verifies by check --strict (replay + signatures + hash parity)"
          fi
