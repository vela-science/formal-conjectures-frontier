name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          # This job reads the repository and pushes nothing. Full depth is what
          # `vela replay` needs; the token is not, and leaving it in .git/config
          # only gives every later step a credential it has no use for.
          persist-credentials: false
      - uses: vela-science/vela@c4023f111ee88f92e6e3c7b47699499a46e83940 # v0.966.4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
      - name: Check out the exact source-local Lean replay contract
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: vela-science/vela
          ref: 051b4d5123dad53aaf49e1123cef61f433551fbf
          path: .contract-source/vela
          # A read of one public contract directory, at a fixed commit.
          persist-credentials: false
      # The whole suite, not the one file that used to run here. Every test is
      # stdlib unittest, so discovery is the entire dependency: a new test file
      # under tests/ is gated the moment it lands, without an edit here.
      - name: Frontier test suite
        env:
          VELA_LEAN_REPLAY_CONTRACT: ${{ github.workspace }}/.contract-source/vela/research/lean-replay-contract
        run: python3 -m unittest discover -s tests -v
