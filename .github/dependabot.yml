version: 2

# One mechanism, not two. Renovate would need a GitHub App installed on the
# vela-science org; Dependabot is native and covers the only ecosystem here.
# There is deliberately no renovate.json beside this file.
#
# The ecosystem below waits a week before it will propose a release.
# `default-days` is the cooldown key that applies to all of them — the semver-*
# keys only reach package managers that carry semver — and a week is roughly the
# window in which a compromised publish gets noticed and yanked. A SHA pin
# records which bytes run, not that those bytes were ever worth running.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # The vela-science/vela pin is moved by hand, once a release is cut and this
    # Frontier has been replayed against it. That pin is what the workflow is
    # asserting it ran under, so a bot advancing it to whatever is on the
    # default branch would race the release process and invalidate the claim.
    ignore:
      - dependency-name: vela-science/vela
    groups:
      workflow-actions:
        patterns:
          - "*"
