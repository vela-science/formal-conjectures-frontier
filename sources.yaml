# The sources this frontier reconciles.
#
# A Frontier owns its own acquisition inventory. Until this file existed, the
# repository, revision and dataset locator for both of these sources were
# constants inside the vela-web projection pipeline, which meant the web
# asserted where this Frontier's evidence came from and nothing here could
# contradict it. The Erdős Frontier has declared its own sources since the
# beginning; this is the same file, for this Frontier.
#
# `source_id` is the identifier the release-scoped source registry publishes
# under. It lives here rather than in a mapping table downstream, so adding a
# source is one edit in one repository.
#
# No `sources.lock.json` exists here yet. When an acquisition run generates one
# it records the exact content hash of each entry; it is never hand-written,
# because a hash nobody computed is worse than no hash at all. Until that run
# happens, the pins below are the whole of what a reader can check.

sources:
  formal_conjectures:
    source_id: source:formal-conjectures
    kind: formal_statement_registry
    repo: google-deepmind/formal-conjectures
    # `data/conjectures.json` is not a tracked path in this repository at any
    # ref. The upstream GitHub Pages workflow builds it from `main` and serves
    # the result at the url below, so there is no raw-content locator to pin and
    # no commit the bytes can be re-fetched from. `pages_commit` is the commit
    # of the active github-pages deployment, resolved from the deployment API on
    # 2026-08-05; the url served those bytes at that moment and will serve
    # different bytes after the next upstream deploy. The retained content root
    # is therefore the only durable pin, exactly as it is for OEIS in the Sidon
    # Frontier, and it lives in the lock that has not been generated yet.
    pages_commit: 4c3577432c87a34761963b04c20aba2ac7e2efd2
    pages_commit_resolved: 2026-08-05T21:22:46Z
    url: https://google-deepmind.github.io/formal-conjectures/data/conjectures.json

  openai_ten_proofs:
    source_id: source:openai-ten-proofs
    kind: formal_library
    repo: openai/ten-proofs
    commit: 94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6
    tree: 174289e4d4958cb0509874e6e53400e098213de7
    url: https://github.com/openai/ten-proofs
    note: >-
      A comparator corpus. Repository presence and publisher review establish
      no independent Lean build, no Comparator result, and no Vela
      Verification.
